version: '3.8'

services:
  rudhvin-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rudhvin-enterprises-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=embedded
      - JWT_SECRET=rudhvin_enterprises_prod_secret_replace_with_strong_key
      - ADMIN_EMAIL=admin@rudhvin.com
      - ADMIN_PASSWORD=Admin@12345
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - CHROME_PATH=/usr/bin/chromium
    volumes:
      # Persist the embedded JSON database and uploaded files on the host server
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
